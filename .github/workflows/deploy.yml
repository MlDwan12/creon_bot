name: Deploy

# Выкатка после зелёного CI на пуше: main — в прод (environment production), develop — на дев-стенд
# (environment dev). Серверы и порядок шагов — DEPLOY.md.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, develop]

# GITHUB_TOKEN — только читать код; больше workflow ничего не нужно
permissions:
  contents: read

jobs:
  deploy:
    # только CI этого репозитория (не форка), на пуше и только зелёный
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    # у каждого environment свои секреты SSH_* и ALERT_*
    environment: ${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'dev' }}
    # одна выкатка за раз; порядок ожидающих не гарантирован — устаревший коммит отсекает шаг ниже
    concurrency:
      group: deploy-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    defaults:
      run:
        shell: bash # = bash -eo pipefail: код возврата ssh не теряется в пайпе
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
      TAG: sha-${{ github.event.workflow_run.head_sha }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      APP: creon_bot
      # куда и что выкатывать на сервере — переменные deploy/remote-deploy.sh
      REMOTE_ENV: >-
        ${{ github.event.workflow_run.head_branch == 'main'
        && 'APP=creon_bot DIR=/opt/fixum SERVICE=fixum_bot PG=postgres DB=fixum DB_USER=fixum'
        || 'APP=creon_bot DIR=/opt/creon SERVICE=creon_bot PG=postgres DB=creon_bot DB_USER=creon' }}
      STAND: ${{ github.event.workflow_run.head_branch == 'main' && 'прод' || 'дев' }}
      # каталог бота (метка выкаченного коммита) и мини-аппа (статика для nginx) — DEPLOY.md
      DIR: ${{ github.event.workflow_run.head_branch == 'main' && '/opt/fixum' || '/opt/creon' }}
      WEB_DIR: ${{ github.event.workflow_run.head_branch == 'main' && '/var/www/fixum-miniapp' || '/var/www/creon-miniapp' }}
      # сайт (web/) — тоже статика для nginx, своя папка и свой vhost (DEPLOY.md, «Сайт»)
      SITE_DIR: ${{ github.event.workflow_run.head_branch == 'main' && '/var/www/fixum-web' || '/var/www/creon-web' }}
    steps:
      # именно тот коммит, который прошёл CI, а не то, что успело прийти в main после
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false
          # вся история — чтобы сравнить с тем, что уже выкачено (шаг What changed)
          fetch-depth: 0

      # CI коммита B может закончиться раньше CI коммита A — тогда A, выкатившись последним, вернул бы
      # стенд назад. Выкатываем только вершину ветки; устаревший пропускаем — вершину выкатит её CI.
      - name: Is latest commit
        id: latest
        env:
          # токен с правом contents: read — ls-remote работает и для приватного репозитория
          GH_TOKEN: ${{ github.token }}
        run: |
          tip="$(git ls-remote "https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}" "refs/heads/$BRANCH" | cut -f1)"
          [ -n "$tip" ] || { echo "не удалось узнать вершину $BRANCH" >&2; exit 1; }
          if [ "$tip" = "$SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$SHA уже не вершина $BRANCH ($tip) — пропускаем, выкатит свежий"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image
        if: steps.latest.outputs.deploy == 'true'
        # адрес Sentry мини-аппа — не секрет (виден в браузере): переменная окружения GitHub, пусто — выключен
        run: docker build --build-arg VITE_SENTRY_DSN="${{ vars.VITE_SENTRY_DSN }}" -t "$APP:$TAG" .

      # Мини-апп — статикой для nginx: этап webapp того же Dockerfile (сборка в контейнере — ключа SSH не видит).
      # ponytail: образ и статика собираются всегда, даже если выкатится одно из двух, — ключ появляется
      # только после сборки, а что выкачено, знает лишь сервер; лишние минуты CI — цена этого порядка.
      - name: Build mini-app
        if: steps.latest.outputs.deploy == 'true'
        run: |
          docker build --target webapp --build-arg VITE_SENTRY_DSN="${{ vars.VITE_SENTRY_DSN }}" -t "$APP-webapp:$TAG" .
          id="$(docker create "$APP-webapp:$TAG")"
          docker cp "$id:/webapp/dist" static
          docker rm "$id" >/dev/null
          tar -czf "static-$SHA.tar.gz" -C static .

      - name: Build site
        if: steps.latest.outputs.deploy == 'true'
        run: |
          docker build --target web -t "$APP-web:$TAG" .
          id="$(docker create "$APP-web:$TAG")"
          docker cp "$id:/web/dist" site
          docker rm "$id" >/dev/null
          tar -czf "site-$SHA.tar.gz" -C site .

      # ключ появляется на раннере только после сборки — код сборки его не застанет
      - name: SSH key
        if: steps.latest.outputs.deploy == 'true'
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # отпечаток сервера — из секрета, а не ssh-keyscan: иначе подменённый хост примем за свой
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host prod
            HostName ${{ secrets.SSH_HOST }}
            Port ${{ secrets.SSH_PORT }}
            User ${{ secrets.SSH_USER }}
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      # Бот, мини-апп и сайт выкатываются независимо: каждый — только если его файлы изменились с той
      # версии, что уже на сервере (метка бота — remote-deploy.sh, мини-аппа и сайта — симлинк current).
      # Метки нет или коммит неизвестен (первая выкатка, force-push) — выкатываем. Сайт ещё не настроен
      # на стенде (нет папки) — пропускаем: без домена и сертификата выкладывать некуда.
      - name: What changed
        id: changes
        if: steps.latest.outputs.deploy == 'true'
        run: |
          changed() {
            local prev="$1"; shift
            [[ "$prev" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$prev^{commit}" 2>/dev/null || return 0
            ! git diff --quiet "$prev" "$SHA" -- "$@"
          }
          prev_api="$(ssh -n prod "cat '$DIR/deployed-api.sha'" 2>/dev/null || true)"
          prev_web="$(ssh -n prod "readlink '$WEB_DIR/current'" 2>/dev/null || true)"
          prev_web="${prev_web##*/}"
          prev_site="$(ssh -n prod "readlink '$SITE_DIR/current'" 2>/dev/null || true)"
          prev_site="${prev_site##*/}"
          api=false web=false site=false
          # бот — всё, кроме фронтов, документов и файлов только для статики
          changed "$prev_api" . ':!webapp' ':!web' ':!packages' ':!*.md' \
            ':!deploy/remote-static.sh' ':!deploy/prod/nginx' && api=true
          changed "$prev_web" webapp packages i18n && web=true
          if ssh -n prod "test -d '$SITE_DIR'"; then
            changed "$prev_site" web packages i18n && site=true
          else
            echo "::notice::сайт на стенде не настроен (нет $SITE_DIR) — пропускаем, DEPLOY.md «Сайт»"
          fi
          parts=""
          $api && parts="бот"
          $web && parts="${parts:+$parts+}мини-апп"
          $site && parts="${parts:+$parts+}сайт"
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "site=$site" >> "$GITHUB_OUTPUT"
          echo "parts=${parts:-ничего — изменения не затронули ни бот, ни мини-апп, ни сайт}" >> "$GITHUB_OUTPUT"
          echo "::notice::выкатываем: ${parts:-ничего} (бот был ${prev_api:-—}, мини-апп ${prev_web:-—}, сайт ${prev_site:-—})"

      - name: Upload image and script
        if: steps.changes.outputs.api == 'true'
        run: |
          docker save "$APP:$TAG" | gzip | ssh prod docker load
          scp -q deploy/remote-deploy.sh prod:remote-deploy.sh

      # итог — код возврата скрипта: 0, только если новая версия на своём образе и healthy.
      # Бот — раньше мини-аппа: новому фронту может понадобиться новый API (обратное — expand → contract).
      - name: Deploy
        if: steps.changes.outputs.api == 'true'
        run: ssh -n prod "$REMOTE_ENV bash remote-deploy.sh $TAG"

      - name: Deploy mini-app
        if: steps.changes.outputs.web == 'true'
        run: |
          scp -q "static-$SHA.tar.gz" deploy/remote-static.sh prod:
          ssh -n prod "WEB_DIR=$WEB_DIR bash remote-static.sh $SHA"

      # тот же скрипт, другая папка; архив — под именем, которое ждёт скрипт (мини-апп свой уже удалил)
      - name: Deploy site
        if: steps.changes.outputs.site == 'true'
        run: |
          scp -q "site-$SHA.tar.gz" "prod:static-$SHA.tar.gz"
          scp -q deploy/remote-static.sh prod:
          ssh -n prod "WEB_DIR=$SITE_DIR bash remote-static.sh $SHA"

      - name: Remove key
        if: always()
        run: rm -f ~/.ssh/id_deploy

      # Итог выкатки — в Telegram отдельным ботом алертов, в тему проекта (MONITORING.md). Нет секретов — шаг молчит.
      # Сбой — сообщаем всегда, даже на checkout или ls-remote; молчим, только если коммит пропущен как не вершина.
      - name: Notify
        if: always() && (steps.latest.outputs.deploy == 'true' || job.status != 'success')
        env:
          ALERT_BOT_TOKEN: ${{ secrets.ALERT_BOT_TOKEN }}
          ALERT_CHAT_ID: ${{ secrets.ALERT_CHAT_ID }}
          # тема проекта в группе алертов (группа с темами); пусто — в общий чат
          ALERT_THREAD_ID: ${{ secrets.ALERT_THREAD_ID }}
          STATUS: ${{ job.status }}
          PARTS: ${{ steps.changes.outputs.parts }}
          # сообщение коммита — только через env: в run его текст стал бы кодом
          COMMIT_MSG: ${{ github.event.workflow_run.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.workflow_run.head_commit.author.name }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$ALERT_BOT_TOKEN" ] && [ -n "$ALERT_CHAT_ID" ] || exit 0
          # у merge-коммита PR первая строка — «Merge pull request #N from …», заголовок PR — третья: берём «#N заголовок»
          title=$(printf '%s\n' "$COMMIT_MSG" | sed -n '1p')
          case "$title" in
            'Merge pull request #'*) pr=${title#Merge pull request }; title="${pr%% *} $(printf '%s\n' "$COMMIT_MSG" | sed -n '3p')" ;;
          esac
          about="${SHA:0:7} · $COMMIT_AUTHOR · $PARTS
          $title
          $COMMIT_URL"
          if [ "$STATUS" = success ]; then
            text="✓ Fixum выкачен ($STAND)
          $about"; silent=true
          else
            text="✗ Выкатка Fixum ($STAND) не удалась (откат на прошлую версию, если был возможен)
          $about
          лог: $RUN_URL"; silent=false
          fi
          # без -f: при ошибке Telegram объясняет причину в description — её и выводим
          res=$(curl -sS --max-time 10 "https://api.telegram.org/bot$ALERT_BOT_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$ALERT_CHAT_ID" --data-urlencode "text=$text" \
            ${ALERT_THREAD_ID:+--data "message_thread_id=$ALERT_THREAD_ID"} \
            --data "disable_notification=$silent" --data "disable_web_page_preview=true") || res=''
          case "$res" in
            *'"ok":true'*) ;;
            *) echo "::warning::не удалось отправить итог в Telegram: $(echo "$res" | grep -o '"description":"[^"]*"')" ;;
          esac
