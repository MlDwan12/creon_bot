name: CI

# develop — рабочая ветка без деплоя, main — релизы (после зелёного CI уезжают в прод).
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://creon:creon@localhost:5432/creon_bot

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            webapp/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Generate Prisma client
        run: yarn prisma:generate

      - name: Typecheck
        run: yarn tsc --noEmit -p tsconfig.json

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build

      - name: Webapp — install
        run: yarn --cwd webapp install --frozen-lockfile

      - name: Webapp — typecheck & build
        run: yarn --cwd webapp build
