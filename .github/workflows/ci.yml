name: CI

# develop — рабочая ветка без деплоя, main — релизы (после зелёного CI уезжают в прод).
# epic/* — большие задачи из нескольких PR: копятся там и одним мержем уходят в develop.
on:
  push:
    branches: [main, develop, 'epic/**']
  pull_request:
    branches: [main, develop, 'epic/**']

# Новый пуш в ту же ветку отменяет прошлый запуск — зависший не копит минуты рядом с новым.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Бот, мини-апп и сайт проверяются отдельно и только при правках в своих файлах: правка сайта не гоняет
# тесты бэкенда на Postgres. Правка этого файла — проверяется всё.
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.diff.outputs.api }}
      miniapp: ${{ steps.diff.outputs.miniapp }}
      site: ${{ steps.diff.outputs.site }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # PR — его правки (checkout делает merge-коммит: HEAD^1 — вершина целевой ветки); пуш — правки
      # пуша. Сравнивать не с чем (новая ветка, force-push) — проверяем всё.
      - id: diff
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        run: |
          changed() {
            git rev-parse -q --verify "$BEFORE^{commit}" >/dev/null || return 0
            ! git diff --quiet "$BEFORE" HEAD -- "$@"
          }
          api=false miniapp=false site=false
          # бот — всё, кроме фронтов и документов (словари i18n и сам CI — тоже его)
          changed . ':!webapp' ':!web' ':!packages' ':!*.md' && api=true
          changed webapp packages i18n .github/workflows/ci.yml && miniapp=true
          changed web packages i18n .github/workflows/ci.yml && site=true
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "miniapp=$miniapp" >> "$GITHUB_OUTPUT"
          echo "site=$site" >> "$GITHUB_OUTPUT"
          echo "::notice::проверяем: бот $api, мини-апп $miniapp, сайт $site"

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    # Обычный прогон — несколько минут; завис (как на скачивании кэша) — GitHub снимет сам через 20,
    # а не через 6 часов по умолчанию.
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://creon:creon@localhost:5432/creon_bot

    # Для интеграционных тестов (yarn test:int): базу creon_bot_test создаст prisma migrate deploy.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: creon
          POSTGRES_PASSWORD: creon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U creon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # Без кэша yarn: он разросся до ~600 МБ и упирался в лимит трафика кэша Actions на аккаунт
      # («Egress is over the account limit») — установка из npm с нуля быстрее его скачивания.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Generate Prisma client
        run: yarn prisma:generate

      - name: Typecheck
        run: yarn tsc --noEmit -p tsconfig.json

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test

      - name: Integration tests
        run: yarn test:int

      - name: Build
        run: yarn build

  miniapp:
    needs: changes
    if: needs.changes.outputs.miniapp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: yarn --cwd webapp install --frozen-lockfile
      - name: Typecheck & build
        run: yarn --cwd webapp build

  site:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: yarn --cwd web install --frozen-lockfile
      - name: Typecheck & build
        run: yarn --cwd web build

  # Итог для защиты веток и для deploy.yml (ждёт зелёный CI): пропущенная проверка — не ошибка,
  # упавшая или отменённая — ошибка. Имя прежнее — обязательная проверка в настройках веток не меняется.
  verify:
    needs: [changes, api, miniapp, site]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "итоги: $RESULTS"
          case " $RESULTS " in
            *' failure '*|*' cancelled '*) exit 1 ;;
          esac
