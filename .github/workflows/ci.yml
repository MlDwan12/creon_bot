name: CI

# develop — рабочая ветка без деплоя, main — релизы (после зелёного CI уезжают в прод).
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://creon:creon@localhost:5432/creon_bot

    # Для интеграционных тестов (yarn test:int): базу creon_bot_test создаст prisma migrate deploy.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: creon
          POSTGRES_PASSWORD: creon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U creon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            webapp/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Generate Prisma client
        run: yarn prisma:generate

      - name: Typecheck
        run: yarn tsc --noEmit -p tsconfig.json

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test

      - name: Integration tests
        run: yarn test:int

      - name: Build
        run: yarn build

      - name: Webapp — install
        run: yarn --cwd webapp install --frozen-lockfile

      - name: Webapp — typecheck & build
        run: yarn --cwd webapp build
