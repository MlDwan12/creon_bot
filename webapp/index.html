<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Fixum</title>
    <!-- Шрифт логотипа — заранее, чтобы заставка не мигнула системным шрифтом -->
    <link rel="preload" href="/fonts/unbounded-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Официальный SDK Mini Apps: его отдаёт сам Telegram, без npm-пакетов посередине -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Стили заставки — здесь, а не в style.css: она видна до того, как загрузится код приложения -->
    <style>
      @font-face {
        font-family: 'Unbounded';
        font-weight: 500 700;
        font-display: block;
        src: url('/fonts/unbounded-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF;
      }
      .splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: #5a2dff;
        color: #ffffff;
      }
      .splash::before,
      .splash::after {
        content: '';
        position: absolute;
        border-radius: 50%;
      }
      .splash::before {
        top: -120px;
        right: -140px;
        width: 360px;
        height: 360px;
        background: #6b42ff;
      }
      .splash::after {
        bottom: -160px;
        left: -120px;
        width: 380px;
        height: 380px;
        background: #4a1fe6;
      }
      .splash-logo {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .splash-img {
        align-self: center;
        width: 112px;
        height: 112px;
        margin-bottom: 8px;
        border-radius: 28px;
        box-shadow: 0 12px 32px rgba(23, 20, 31, 0.35);
      }
      .splash-word {
        font-family: 'Unbounded', system-ui, sans-serif;
        font-size: 52px;
        font-weight: 700;
        letter-spacing: -1.8px;
        line-height: 1;
      }
      .splash-bar {
        height: 8px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.22);
        overflow: hidden;
      }
      .splash-bar::before {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 4px;
        background: #d6f44c;
        animation: splash-load 1.1s ease-in-out infinite;
      }
      @keyframes splash-load {
        from { transform: translateX(-100%); }
        to { transform: translateX(250%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-bar::before { animation: none; }
      }
    </style>
  </head>
  <body>
    <!-- Содержимое #app Vue заменит при запуске — до этого виден логотип с полоской загрузки -->
    <div id="app">
      <div class="splash">
        <div class="splash-logo" role="progressbar" aria-label="Fixum загружается">
          <img class="splash-img" src="/logo.webp" alt="" width="112" height="112" />
          <span class="splash-word">Fixum</span>
          <span class="splash-bar"></span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
