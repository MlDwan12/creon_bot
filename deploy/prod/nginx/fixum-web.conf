# Сайт Fixum: HTTPS. Страницы — статика из SITE_DIR (выкладывает deploy/remote-static.sh), /api/ — бот
# на 127.0.0.1:3000 (тот же, что у мини-аппа: вход по cookie сессии, src/auth/web-auth.controller.ts).
# DOMAIN и SITE_DIR подставляются при установке (DEPLOY.md, «Сайт»): прод — web.fixumapp.com и
# /var/www/fixum-web. Зона limit_req «fixum» объявлена в fixum.conf — этот файл ставится рядом с ним.
# В отличие от мини-аппа, сайт во фрейме не открывается никем: frame-ancestors 'none' (от кликджекинга).

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name DOMAIN;

    ssl_certificate /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    limit_req zone=fixum burst=40 nodelay;
    limit_req_status 429;

    root SITE_DIR/current;

    # Только API: ссылки /r/, /v/ и OAuth-колбэки живут на домене мини-аппа
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Файлы сборки с хешем в имени не меняются — кэш на год.
    # add_header внутри location отменяет заголовки уровня server — поэтому все повторены здесь.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # Остальное — index.html (экраны роутера сайта), всегда свежий
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }
}
