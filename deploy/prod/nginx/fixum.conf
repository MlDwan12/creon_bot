# Fixum: HTTPS → бот на 127.0.0.1:3000 (мини-апп, API, ссылки /r/, OAuth-колбэки).
# DOMAIN подставляется при установке (deploy/prod/SERVER.md, слой 4).
# frame-ancestors и X-Frame-Options здесь не добавлять: Telegram Web открывает Mini App во фрейме,
# заголовки безопасности ставит сам Nest (src/main.ts).

# ponytail: лимит на IP — мобильные операторы сажают многих за один IP (CGNAT); упрётся — поднять rate/burst
limit_req_zone $binary_remote_addr zone=fixum:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;

    # продление сертификата certbot'ом идёт сюда, а не в default.conf
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name DOMAIN;

    ssl_certificate /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    limit_req zone=fixum burst=40 nodelay;
    limit_req_status 429;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
