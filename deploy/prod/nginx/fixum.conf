# Fixum: HTTPS. Мини-апп — статика из MINIAPP_DIR (выкладывает deploy/remote-static.sh), всё остальное
# (API, ссылки /r/ и /v/, OAuth-колбэки) — бот на 127.0.0.1:3000.
# DOMAIN и MINIAPP_DIR подставляются при установке (DEPLOY.md, «Мини-апп — статикой через nginx»):
# прод — /var/www/fixum-miniapp, дев — /var/www/creon-miniapp.
# frame-ancestors и X-Frame-Options: DENY здесь не ставить — Telegram Web открывает Mini App во фрейме;
# заголовки безопасности для API ставит сам Nest (src/main.ts), для статики — блок ниже.

# ponytail: лимит на IP — мобильные операторы сажают многих за один IP (CGNAT); упрётся — поднять rate/burst
limit_req_zone $binary_remote_addr zone=fixum:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;

    # продление сертификата certbot'ом идёт сюда, а не в default.conf
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name DOMAIN;

    ssl_certificate /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    limit_req zone=fixum burst=40 nodelay;
    limit_req_status 429;

    root MINIAPP_DIR/current;

    # для всех proxy_pass ниже (наследуются, пока location не задаёт свои)
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Бэкенд: API, ссылки на товар и ролики, возврат с площадок после подключения аккаунта
    location ~ ^/(api|r|v|oauth)/ {
        proxy_pass http://127.0.0.1:3000;
    }

    # Файлы сборки с хешем в имени не меняются — кэш на год.
    # add_header внутри location отменяет заголовки уровня server — поэтому все повторены здесь.
    location /assets/ {
        try_files $uri @app;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # Экраны мини-аппа (/orders/5 — не файл, а экран роутера) — index.html, всегда свежий.
    # Папки ещё нет (стенд до первой выкатки статики) — как раньше, мини-апп из бота (@app).
    location / {
        try_files $uri /index.html @app;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "frame-ancestors https://web.telegram.org https://*.telegram.org" always;
    }

    location @app {
        proxy_pass http://127.0.0.1:3000;
    }
}
