# Всё, что пришло не на наш домен (сканеры по IP, чужой Host), — закрываем соединение без ответа (444),
# HTTPS — без рукопожатия: сертификат и имя домена сканеру не показываем.
# Здесь же — проверка Let's Encrypt (HTTP-01): так сертификат выпускается до того, как есть vhost домена.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 444;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
